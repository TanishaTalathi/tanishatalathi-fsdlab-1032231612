<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<script src="script.js"></script>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
}

.container {
    width: 40%;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 5px;
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0 15px 0;
}

button {
    padding: 8px 12px;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>PRIYA-NAGARGOJE Registration Form</h2>

<form onsubmit="return validateForm()">

<label>Name:</label>
<input type="text" id="name">

<label>Email:</label>
<input type="text" id="email">

<label>Password:</label>
<input type="password" id="password">

<label>Mobile Number:</label>
<input type="text" id="mobile">

<input type="submit" value="Register">

</form>

</div>

</body>
</html>
